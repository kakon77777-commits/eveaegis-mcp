# --------------------------------------------------------------------------
# File markers. Presence of a file is structural evidence, not prose.
# Keys are matched case-insensitively against repository paths.
# --------------------------------------------------------------------------
file_category:
  package.json: [LIBRARY, SERVICE]
  pyproject.toml: [LIBRARY]
  setup.py: [LIBRARY]
  cargo.toml: [LIBRARY]
  go.mod: [LIBRARY, SERVICE]
  dockerfile: [SERVICE]
  docker-compose.yml: [SERVICE]
  wrangler.toml: [SERVICE]
  wrangler.jsonc: [SERVICE]
  procfile: [SERVICE]
  index.html: [WEBSITE]
  _config.yml: [WEBSITE]
  astro.config.mjs: [WEBSITE]
  next.config.js: [WEBSITE]
  manifest.json: [PLUGIN]
  mkdocs.yml: [DOCUMENTATION]
  docusaurus.config.js: [DOCUMENTATION]
  book.toml: [DOCUMENTATION]
  project.godot: [GAME]
  data/: [DATASET]
  datasets/: [DATASET]
  papers/: [RESEARCH]
  notebooks/: [RESEARCH]

# Files that are evidence of engineering maturity rather than of category.
maturity_markers:
  tests: [tests/, test/, spec/, __tests__/]
  ci: [.github/workflows/, .gitlab-ci.yml, azure-pipelines.yml]
  release: [changelog.md, changelog, release-notes.md]
  packaging: [pyproject.toml, package.json, cargo.toml, setup.py]

# --------------------------------------------------------------------------
# Primary-language hints. Weakest structural signal; never decisive alone.
# --------------------------------------------------------------------------
language_category:
  HTML: [WEBSITE]
  CSS: [WEBSITE]
  Jupyter Notebook: [RESEARCH]
  TeX: [RESEARCH]
  GDScript: [GAME]
  Dockerfile: [SERVICE]

# --------------------------------------------------------------------------
# §5.2 Lifecycle markers read out of README prose. English + zh-Hant, because the
# portfolio is bilingual and a zh-only notice must not be invisible to governance.
# --------------------------------------------------------------------------
superseded_markers:
  - superseded by
  - superseded-by
  - replaced by
  - moved to
  - has moved to
  - now lives at
  - now maintained at
  - development continues at
  - deprecated in favor of
  - deprecated in favour of
  - use instead
  - 已被取代
  - 已遷移
  - 已搬遷
  - 請改用
  - 繼任專案

deprecated_markers:
  - deprecated
  - no longer maintained
  - unmaintained
  - abandoned
  - discontinued
  - 停止維護
  - 已淘汰

# §5.3 Maturity prose markers.
maturity_keywords:
  CONCEPT: [idea, concept, draft, sketch, brainstorm, 構想, 草稿]
  MVP: [mvp, minimum viable, first cut, 最小可行]
  ALPHA: [alpha, early stage, unstable, wip, work in progress]
  BETA: [beta, release candidate, preview release, 公測]
  STABLE: [stable, production ready, ga release, 穩定版]
  PRODUCTION: [in production, live at, deployed at, 正式上線, 已上線]
  LEGACY: [legacy, end of life, eol, 已停止開發]

# --------------------------------------------------------------------------
# §5.4 Criticality hints. Criticality has no UNKNOWN member, so LOW is the
# least-privilege default and every escalation above it must be justified here.
# --------------------------------------------------------------------------
criticality_hints:
  # Repositories named here are the portfolio's load-bearing assets.
  critical_repositories: []
  high_repositories: []
  # Substrings in the repository name that imply the asset is load-bearing.
  high_name_keywords:
    - eveglyph
    - eml
    - agiright
    - logic-matrix
    - ctcl
    - aiboard
    - ai-board
    - evemiss
  critical_topics:
    - production
    - flagship
    - security
  high_topics:
    - public-site
    - live
    - platform
  # A public repository that is actively pushed and advertises a homepage is at
  # least MEDIUM: breaking it is publicly visible.
  medium_when_public_and_active: true
  # Popularity thresholds (stars) that raise criticality on their own.
  high_min_stars: 25
  critical_min_stars: 200

# --------------------------------------------------------------------------
# §5.5 Agent access. The classifier proposes a *ceiling*, never a grant.
# The effective ceiling is min(classification proposal, origin-type cap).
# --------------------------------------------------------------------------
agent_access:
  # Highest mode the classifier will ever propose on its own. Anything above this
  # requires a human decision, so an autonomous mis-classification cannot buy
  # itself write access.
  max_proposed: PR_ONLY
  # Origin-type caps (§12). Missing origin profile means "not analysed yet".
  origin_caps:
    ORIGINAL: CONTROLLED_WRITE
    ORIGINAL_WITH_DEPENDENCIES: CONTROLLED_WRITE
    TEMPLATE_DERIVED: PR_ONLY
    PLUGIN_OR_EXTENSION: PR_ONLY
    GENERATED_PROJECT: PR_ONLY
    GITHUB_FORK: PR_ONLY
    DETACHED_FORK: PR_ONLY
    DERIVATIVE_PROJECT: PR_ONLY
    UPSTREAM_IMPORT: READ_ONLY
    MULTI_SOURCE_COMPOSITE: READ_ONLY
    MIRROR: READ_ONLY
    VENDOR_SNAPSHOT: READ_ONLY
    UNKNOWN: READ_ONLY
  # No origin profile row at all — Phase 2 has not run for this repository.
  no_origin_profile_cap: READ_ONLY
  # An origin verdict this uncertain is not a basis for granting anything.
  low_confidence_threshold: 0.50
  low_confidence_cap: READ_ONLY
  # Lifecycles that freeze a repository regardless of everything else.
  frozen_lifecycles: [ARCHIVED, SUPERSEDED]
  frozen_cap: READ_ONLY
  # Categories that are, by definition, somebody else's code.
  foreign_categories: [FORK, MIRROR, REFERENCE, ARCHIVE]
  foreign_cap: READ_ONLY
  # Breaking a CRITICAL repository is never worth an autonomous direct write.
  critical_cap: PR_ONLY
  # Nothing is understood about this repository yet.
  unknown_lifecycle_cap: READ_ONLY
