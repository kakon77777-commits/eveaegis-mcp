# EveAegis classification profile "evemisslab-v1" (whitepaper §5, §27).
#
# The classifier reads *only* this file for its vocabulary. Tuning the portfolio
# must never require a code edit — that is the whole point of keeping the keyword
# maps, the topic vocabulary and the criticality hints out here.
#
# Scoring model: every source of evidence (topic / file marker / repository name /
# description / README / language) contributes its family weight to one or more
# categories. The winner must clear `thresholds.min_category_score` AND beat the
# runner-up by `thresholds.min_category_margin`, otherwise the verdict is UNKNOWN.
# Absence of evidence is a first-class answer (axiom 4 in spirit).

schema_version: "0.1"
profile: evemisslab-v1

# --------------------------------------------------------------------------
# Evidence family weights. Structural facts outrank prose.
# --------------------------------------------------------------------------
weights:
  topic: 0.50          # a curated GitHub topic is a deliberate human statement
  file_marker: 0.35    # a file on disk is harder to fake than a description
  name: 0.30
  description: 0.25
  readme: 0.15         # README prose is the weakest signal; it is marketing copy
  language: 0.15
  homepage: 0.20

thresholds:
  min_category_score: 0.30
  min_category_margin: 0.10
  # Lifecycle windows, in days since the last push.
  active_days: 90
  maintenance_days: 365
  stale_days: 365
  archive_candidate_days: 540
  archive_candidate_max_stars: 3
  # A repository below this size with no marker files is treated as an idea, not a product.
  idea_max_size_kb: 40
  superseded_name_overlap: 0.60

